    // ---- Safety ---------------------------------------------------------------
    // Ticket text is user-supplied and gets dropped into innerHTML all over the
    // app. Run it through this first or a complaint containing "<img onerror=...>"
    // becomes a script injection.
    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // ---- Geo ------------------------------------------------------------------
    function haversineMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    const CLUSTER_RADIUS_M = DUPLICATE_RADIUS_M;
    const CLUSTER_WINDOW_MS = DUPLICATE_WINDOW_DAYS * 24 * 60 * 60 * 1000;

    // ---- Priority / severity --------------------------------------------------
    function priorityFromScore(score) {
      if (score >= 85) return 'critical';
      if (score >= 65) return 'high';
      if (score >= 35) return 'medium';
      return 'low';
    }

    function slaHoursFor(priority) {
      return SLA_HOURS[priority] ?? SLA_HOURS.medium;
    }

    function slaLabel(hours) {
      if (hours < 24) return `${hours}h SLA`;
      return `${Math.round(hours / 24)}-Day SLA`;
    }

    function priorityColor(priority) {
      return priority === 'critical' ? 'red'
           : priority === 'high'     ? 'amber'
           : priority === 'medium'   ? 'emerald'
           : 'slate';
    }

    // Corroborating reports raise urgency: every 3 extra citizens adds 8 points,
    // capped at +25 so a swarm of low-severity reports can't fake a critical.
    function clusterBoost(reportCount) {
      if (!reportCount || reportCount < 2) return 0;
      return Math.min(25, Math.floor((reportCount - 1) / 3) * 8 + 4);
    }

    // ---- Timestamps -----------------------------------------------------------
    // Firestore hands back Timestamp objects on live reads but plain Dates on the
    // local echo of a just-written doc. Normalise both.
    function toMillis(value) {
      if (!value) return 0;
      if (typeof value.toMillis === 'function') return value.toMillis();
      if (value instanceof Date) return value.getTime();
      if (typeof value === 'number') return value;
      if (value.seconds) return value.seconds * 1000;
      return 0;
    }

    function formatDuration(ms) {
      const mins = Math.floor(Math.abs(ms) / 60000);
      const d = Math.floor(mins / 1440);
      const h = Math.floor((mins % 1440) / 60);
      const m = mins % 60;
      if (d > 0) return `${d}d ${h}h`;
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m`;
    }

    function formatDate(value) {
      const ms = toMillis(value);
      if (!ms) return '—';
      return new Date(ms).toLocaleString(undefined, {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      });
    }

    // ---- SLA state ------------------------------------------------------------
    // Returns everything a card needs to render a countdown chip.
    function slaState(ticket) {
      const status = ticket.status || 'Submitted';
      const createdMs = toMillis(ticket.timestamp);
      const hours = ticket.slaHours ?? slaHoursFor(ticket.priority || 'medium');
      const deadlineMs = toMillis(ticket.slaDeadline) || (createdMs + hours * 3600000);

      if (status === 'Resolved') {
        const resolvedMs = toMillis(ticket.resolvedAt);
        const withinSla = resolvedMs ? resolvedMs <= deadlineMs : true;
        return {
          resolved: true, overdue: false, withinSla, deadlineMs, msLeft: 0,
          label: withinSla ? 'Closed within SLA' : 'Closed late',
          tone: withinSla ? 'emerald' : 'slate'
        };
      }

      const msLeft = deadlineMs - Date.now();
      if (msLeft <= 0) {
        return {
          resolved: false, overdue: true, withinSla: false, deadlineMs, msLeft,
          label: `Overdue by ${formatDuration(msLeft)}`, tone: 'red'
        };
      }
      const tone = msLeft < 3600000 ? 'red' : msLeft < 6 * 3600000 ? 'amber' : 'slate';
      return {
        resolved: false, overdue: false, withinSla: true, deadlineMs, msLeft,
        label: `${formatDuration(msLeft)} left`, tone
      };
    }

    // ---- Civic score ----------------------------------------------------------
    // 10 points to file, 15 more once an officer resolves it (that's the
    // "verified" signal), 5 more if the report attracted corroboration.
    function scoreForTicket(ticket) {
      let pts = 10;
      if ((ticket.status || '') === 'Resolved') pts += 15;
      if ((ticket.reportCount || 1) > 1) pts += 5;
      if (ticket.photoData) pts += 3;
      return pts;
    }

    function civicRank(score) {
      if (score >= 300) return { label: 'City Guardian', badge: '🏛️' };
      if (score >= 150) return { label: 'Ward Champion', badge: '🥇' };
      if (score >= 75)  return { label: 'Active Citizen', badge: '🥈' };
      if (score >= 25)  return { label: 'Contributor', badge: '🥉' };
      return { label: 'Newcomer', badge: '🌱' };
    }

    // ---- Languages ------------------------------------------------------------

    function newTicketId() {
      return 'TCK-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000);
    }

    function trackUrl(ticketId) {
      const base = location.href.replace(/[^/]*$/, '');
      return `${base}track.html?id=${encodeURIComponent(ticketId)}`;
    }

    // Pulls a ward-ish name out of whatever Nominatim gave us, so the public
    // dashboard has something to group by.
    function wardFromAddress(address) {
      if (!address) return null;
      return address.suburb || address.neighbourhood || address.city_district ||
             address.county || address.state_district || null;
    }

        // ---------- inlined from civic-ai.js ----------
    // ============================================================================
    // CivicSync — AI triage engine
    //
    // One entry point: aiTriage({ text, photoDataUrl, langHint }).
    // It calls Gemini Flash with the raw complaint (and the photo, if there is
    // one) and gets structured JSON back. If there's no API key, or the call
    // fails, or the model returns junk, it falls back to the original keyword
    // rules so the demo never dies on stage.
    // ============================================================================


    function aiConfigured() {
      return typeof GEMINI_API_KEY === 'string' &&
             GEMINI_API_KEY.length > 20 &&
             !GEMINI_API_KEY.startsWith('PASTE_');
    }

    // ---------------------------------------------------------------------------
    // Fallback: the original keyword rules, widened a bit. Used when the model
    // isn't reachable. Marked engine:'fallback' so the UI can be honest about it.
    // ---------------------------------------------------------------------------
    const RULES = [
      { score: 94, cat: 'Electrical Hazard',      dept: 'DISCOM (Electricity)', words: ['spark','wire','electric','shock','transformer','live cable','current'] },
      { score: 88, cat: 'Drainage & Sewage',      dept: 'Sanitation',           words: ['sewage','manhole','open drain','overflow','drainage'] },
      { score: 82, cat: 'Road & Pothole',         dept: 'Public Works',         words: ['pothole','crater','collapsed road','sinkhole','accident'] },
      { score: 78, cat: 'Water Supply / Leakage', dept: 'Water Board',          words: ['water','leak','pipeline','burst','no supply'] },
      { score: 70, cat: 'Stray Animals',          dept: 'Animal Control',       words: ['stray dog','snake','monkey','cattle','bite'] },
      { score: 62, cat: 'Streetlight',            dept: 'Public Works',         words: ['streetlight','street light','dark','lamp post','pole light'] },
      { score: 58, cat: 'Garbage & Sanitation',   dept: 'Sanitation',           words: ['garbage','trash','waste','dump','litter','stink'] },
      { score: 55, cat: 'Traffic & Signage',      dept: 'Traffic Police',       words: ['signal','traffic','sign board','zebra','parking'] },
      { score: 50, cat: 'Parks & Trees',          dept: 'Parks & Horticulture', words: ['tree','branch','park','playground','fallen'] }
    ];

    function keywordTriage(text) {
      const lower = String(text || '').toLowerCase();
      let hit = RULES.find(r => r.words.some(w => lower.includes(w)));
      if (!hit) hit = { score: 40, cat: 'Other', dept: 'Public Works' };

      // Urgency words nudge the score up a little.
      let score = hit.score;
      if (/urgent|danger|child|school|hospital|injur|fire|emergency|died|death/.test(lower)) {
        score = Math.min(99, score + 8);
      }
      const priority = priorityFromScore(score);
      return normalise({
        category: hit.cat,
        department: hit.dept,
        severity_score: score,
        priority,
        reasoning: 'Matched on keywords — Gemini key not configured, using the offline rule engine.',
        detected_language: 'en',
        english_text: text,
        summary: String(text || '').slice(0, 80),
        spam_likelihood: 0,
        photo_matches_complaint: null,
        photo_findings: null
      }, 'fallback');
    }

    // ---------------------------------------------------------------------------
    // Prompt
    // ---------------------------------------------------------------------------
    function buildPrompt(text, hasPhoto, langHint) {
      const lang = langByCode(langHint || 'en');
      return `You are the triage engine for an Indian municipal grievance system. A citizen has filed the complaint below. Assess it the way an experienced municipal duty officer would.

    COMPLAINT TEXT (the citizen may be writing in ${lang.name} or any Indian language):
    """
    ${text || '(no text provided)'}
    """

    ${hasPhoto ? `An attached photo is included with this request. Look at it carefully and use it as evidence.` : `No photo was attached.`}

    Return ONE JSON object and nothing else. No markdown, no code fences, no commentary.

    {
      "category": one of ${JSON.stringify(CATEGORIES)},
      "department": one of ${JSON.stringify(DEPARTMENTS)},
      "severity_score": integer 0-100,
      "priority": "critical" | "high" | "medium" | "low",
      "reasoning": one or two plain sentences a municipal officer would accept, in English,
      "detected_language": ISO 639-1 code of the language the citizen wrote in,
      "english_text": the complaint faithfully translated into English (echo it unchanged if already English),
      "summary": under 12 words, English, suitable as a work-order title,
      "spam_likelihood": integer 0-100, how likely this is a joke/test/abusive submission,
      "photo_matches_complaint": true | false | null (null only if no photo was sent),
      "photo_findings": one sentence describing what the photo actually shows, or null
    }

    SEVERITY CALIBRATION — anchor to these, do not inflate:
    - 90-100: immediate threat to life. Live/sparking wires, collapsed structure, open manhole on a busy road, sewage inside homes, gas leak.
    - 70-89: serious injury risk or large-scale disruption. Deep pothole on a main road, burst water main, no water for a whole street, transformer humming/smoking, stray dog pack near a school.
    - 40-69: real problem, no immediate danger. Uncollected garbage, one dead streetlight, a leaking tap, a faded zebra crossing.
    - 10-39: cosmetic or minor. Hairline crack, faded paint, one overgrown branch.
    - 0-9: not a genuine civic issue.

    Raise the score when the complaint mentions children, a school, a hospital, night-time, or an elderly person. Lower it when the wording is vague and there is no evidence of danger.

    ${hasPhoto ? `PHOTO RULES — this matters:
    - Judge severity from what the photo SHOWS, not only what the text CLAIMS. A photo of a hairline crack does not justify a 90 even if the text says "huge dangerous crater".
    - Set "photo_matches_complaint" to false when the photo has nothing to do with the described issue (a selfie, a meme, a blank wall, an unrelated indoor scene). When it is false, cap severity_score at 20 and set spam_likelihood above 70.
    - If the photo shows the issue is clearly worse than the text suggests, raise the score and say so in "reasoning".` : ''}`;
    }

    // ---------------------------------------------------------------------------
    // Normalise whatever comes back into a shape the app can rely on
    // ---------------------------------------------------------------------------
    function normalise(raw, engine) {
      let score = Number(raw.severity_score);
      if (!Number.isFinite(score)) score = 40;
      score = Math.max(0, Math.min(100, Math.round(score)));

      const spam = Math.max(0, Math.min(100, Number(raw.spam_likelihood) || 0));
      const photoMatches = raw.photo_matches_complaint === null || raw.photo_matches_complaint === undefined
        ? null : !!raw.photo_matches_complaint;

      // Hard guard: a photo that contradicts the text can't produce a critical.
      if (photoMatches === false) score = Math.min(score, 20);

      const priority = ['critical','high','medium','low'].includes(raw.priority) && photoMatches !== false
        ? raw.priority
        : priorityFromScore(score);

      const department = DEPARTMENTS.includes(raw.department) ? raw.department : 'Public Works';
      const category = CATEGORIES.includes(raw.category) ? raw.category : 'Other';

      return {
        engine,
        category,
        department,
        score,
        priority,
        slaHours: slaHoursFor(priority),
        reasoning: String(raw.reasoning || '').slice(0, 400) || 'No reasoning returned.',
        detectedLanguage: String(raw.detected_language || 'en').slice(0, 5).toLowerCase(),
        englishText: String(raw.english_text || '').trim(),
        summary: String(raw.summary || '').slice(0, 120),
        spamLikelihood: spam,
        photoMatches,
        photoFindings: raw.photo_findings ? String(raw.photo_findings).slice(0, 300) : null
      };
    }

    // ---------------------------------------------------------------------------
    // The actual call
    // ---------------------------------------------------------------------------
    function splitDataUrl(dataUrl) {
      const m = /^data:(image\/[a-zA-Z+]+);base64,(.+)$/.exec(dataUrl || '');
      if (!m) return null;
      return { mimeType: m[1], data: m[2] };
    }

    async function aiTriage({ text, photoDataUrl = null, langHint = 'en' } = {}) {
      if (!aiConfigured()) return keywordTriage(text);
      if (!text && !photoDataUrl) return keywordTriage(text);

      const parts = [{ text: buildPrompt(text, !!photoDataUrl, langHint) }];
      const img = splitDataUrl(photoDataUrl);
      if (img) parts.push({ inline_data: { mime_type: img.mimeType, data: img.data } });

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);

      try {
        const res = await fetch(`${GEMINI_ENDPOINT}?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            contents: [{ role: 'user', parts }],
            generationConfig: {
              temperature: 0.15,
              maxOutputTokens: 700,
              responseMimeType: 'application/json'
            }
          })
        });

        if (!res.ok) throw new Error('Gemini HTTP ' + res.status);
        const data = await res.json();
        const out = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
        const cleaned = out.replace(/```json/gi, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(cleaned);
        const result = normalise(parsed, 'gemini');
        if (!result.englishText) result.englishText = text;
        return result;
      } catch (err) {
        console.warn('[CivicSync] Gemini triage failed, falling back to keywords:', err);
        const fb = keywordTriage(text);
        fb.reasoning = 'AI service unreachable — scored by the offline rule engine instead.';
        return fb;
      } finally {
        clearTimeout(timeout);
      }
    }

    // ---------------------------------------------------------------------------
    // Small translation helper, used to show an authority's free-text note back to
    // the citizen in their own language.
    // ---------------------------------------------------------------------------
    async function translateText(text, targetLangCode) {
      if (!aiConfigured() || !text || targetLangCode === 'en') return text;
      const lang = langByCode(targetLangCode);
      try {
        const res = await fetch(`${GEMINI_ENDPOINT}?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{
              text: `Translate the following into ${lang.name}. Reply with the translation only, no quotes or notes.\n\n${text}`
            }] }],
            generationConfig: { temperature: 0, maxOutputTokens: 300 }
          })
        });
        const data = await res.json();
        return data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || text;
      } catch {
        return text;
      }
    }



    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const complaintsRef = collection(db, 'complaints');

    let lang = 'en';
    let current = null;
    let unsub = null;
    let miniMap = null;

    (function buildLangSelect() {
      const sel = document.getElementById('langSelect');
      sel.innerHTML = LANGUAGES.map(l => `<option value="${l.code}">${l.native}</option>`).join('');
    })();

    window.setLang = function(code) { lang = code; if (current) paint(current); };

    function toast(msg) {
      const el = document.getElementById('toast');
      el.innerText = msg;
      el.classList.remove('hidden');
      clearTimeout(window._t);
      window._t = setTimeout(() => el.classList.add('hidden'), 2500);
    }

    window.wipe = function(id, value) {
      const wrap = document.getElementById(id);
      if (!wrap) return;
      wrap.querySelector('.wipe-after').style.clipPath = `inset(0 0 0 ${value}%)`;
      wrap.querySelector('.wipe-handle').style.left = `${value}%`;
    };

    window.shareThis = async function() {
      if (!current) return;
      const url = trackUrl(current.ticketId);
      try {
        if (navigator.share) { await navigator.share({ title: `CivicSync ${current.ticketId}`, url }); return; }
        await navigator.clipboard.writeText(url);
        toast('Link copied');
      } catch (e) { if (e.name !== 'AbortError') window.prompt('Copy this link:', url); }
    };

    const STAGES = ['Submitted', 'Dispatched', 'Resolved'];

    function paint(tk) {
      const color = priorityColor(tk.priority);
      const status = tk.status || 'Submitted';
      const sla = slaState(tk);
      const stageIdx = status === 'Resolved' ? 2 : status === 'Dispatched' ? 1 : 0;
      const displayText = tk.originalText || tk.text;

      const timeline = STAGES.map((s, i) => {
        const done = i <= stageIdx;
        const stamp = i === 0 ? formatDate(tk.timestamp)
                    : i === 1 ? (tk.dispatchedAt ? formatDate(tk.dispatchedAt) : '')
                    : (tk.resolvedAt ? formatDate(tk.resolvedAt) : '');
        return `
          <div class="flex gap-3">
            <div class="flex flex-col items-center">
              <div class="w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-black ${
                done ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-400'}">${done ? '✓' : i + 1}</div>
              ${i < STAGES.length - 1 ? `<div class="w-0.5 flex-1 ${i < stageIdx ? 'bg-emerald-500' : 'bg-slate-200'}"></div>` : ''}
            </div>
            <div class="pb-4">
              <div class="text-xs font-bold ${done ? 'text-slate-900' : 'text-slate-400'}">${esc(t(s, lang))}</div>
              <div class="text-[10px] text-slate-400">${esc(stamp)}</div>
            </div>
          </div>`;
      }).join('');

      const beforeAfter = (tk.photoData && tk.resolutionPhotoData) ? `
        <div class="space-y-1">
          <div class="flex items-center justify-between text-[10px] font-bold text-slate-500">
            <span>${esc(t('before', lang))}</span><span>${esc(t('after', lang))}</span>
          </div>
          <div class="wipe-wrap border border-slate-200" id="wipeTrack">
            <img src="${tk.photoData}" alt="Before the repair" />
            <div class="wipe-after" style="clip-path: inset(0 0 0 50%);">
              <img src="${tk.resolutionPhotoData}" alt="After the repair" />
            </div>
            <div class="wipe-handle" style="left:50%"></div>
            <input type="range" min="0" max="100" value="50" class="wipe-range"
                   aria-label="Drag to compare before and after" oninput="wipe('wipeTrack', this.value)" />
          </div>
        </div>` : (tk.photoData ? `<img src="${tk.photoData}" class="w-full h-52 object-cover rounded-xl border border-slate-200" alt="Reported issue" />` : '');

      document.getElementById('result').innerHTML = `
        <div class="p-5 rounded-3xl bg-white border ${sla.overdue ? 'border-red-300' : 'border-slate-200'} shadow-lg space-y-4 anim-scale">
          <div class="flex items-start justify-between gap-3 flex-wrap">
            <div>
              <div class="font-mono text-lg font-black text-blue-600">${esc(tk.ticketId)}</div>
              <div class="text-[11px] text-slate-500">${esc(tk.location || '')}</div>
            </div>
            <button onclick="shareThis()" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow transition">🔗 ${esc(t('shareStatus', lang))}</button>
          </div>

          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-${color}-100 text-${color}-700">${esc(t(tk.priority, lang))}</span>
            <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${esc(t(status, lang))}</span>
            <span class="text-[10px] font-black px-2 py-0.5 rounded-full bg-${sla.tone}-100 text-${sla.tone}-700">⏱️ ${esc(sla.label)}</span>
            ${(tk.reportCount || 1) > 1 ? `<span class="text-[10px] font-black px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700">👥 ${tk.reportCount} ${esc(t('reportedBy', lang))}</span>` : ''}
          </div>

          <p class="text-sm font-bold leading-relaxed">${esc(displayText)}</p>
          <div class="text-[11px] text-slate-500">🏢 ${esc(tk.department || '')} &bull; 🗂️ ${esc(tk.category || '')}</div>

          ${beforeAfter}

          <div class="pt-2 border-t border-slate-100">${timeline}</div>

          ${typeof tk.lat === 'number' ? `<div id="miniMap" class="h-48 w-full rounded-xl border border-slate-200 overflow-hidden"></div>` : ''}
        </div>`;

      if (typeof tk.lat === 'number') {
        setTimeout(() => {
          if (miniMap) { miniMap.remove(); miniMap = null; }
          miniMap = L.map('miniMap', { zoomControl: false, attributionControl: false }).setView([tk.lat, tk.lng], 16);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(miniMap);
          L.marker([tk.lat, tk.lng]).addTo(miniMap);
          setTimeout(() => miniMap.invalidateSize(), 100);
        }, 0);
      }
    }

    window.lookup = function() {
      const id = document.getElementById('idInput').value.trim();
      if (!id) return;
      history.replaceState(null, '', `?id=${encodeURIComponent(id)}`);
      if (unsub) unsub();

      document.getElementById('result').innerHTML =
        `<div class="text-center text-xs text-slate-400 py-10">Looking up ${esc(id)}…</div>`;

      unsub = onSnapshot(query(complaintsRef, where('ticketId', '==', id)), (snap) => {
        if (snap.empty) {
          current = null;
          document.getElementById('result').innerHTML =
            `<div class="p-6 rounded-3xl bg-white border border-slate-200 text-center space-y-2">
               <div class="text-2xl">🔍</div>
               <div class="text-xs font-bold text-slate-700">No complaint found with reference ${esc(id)}</div>
               <div class="text-[11px] text-slate-500">Check the reference and try again — it looks like TCK-2026-1234.</div>
             </div>`;
          return;
        }
        current = snap.docs[0].data();
        paint(current);
      }, (err) => {
        console.error(err);
        document.getElementById('result').innerHTML =
          `<div class="text-center text-xs text-red-500 py-10">Couldn't reach the ticket register.</div>`;
      });
    };

    document.getElementById('idInput').addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });

    const preset = new URLSearchParams(location.search).get('id');
    if (preset) {
      document.getElementById('idInput').value = preset;
      lookup();
    }
  </script>
</body>
</html>
